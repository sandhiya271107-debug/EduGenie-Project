<!DOCTYPE html>
<html>
<head>
    <title>EduGenie AI</title>
    <style>
        body { font-family: Arial; padding: 30px; max-width: 800px; margin: auto; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; }
        button { padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; }
        #output { margin-top: 20px; padding: 15px; border: 1px solid #ccc; background: #f9f9f9; white-space: pre-wrap; }
    </style>
</head>
<body>
    <h1>EduGenie AI</h1>
    <p>Your AI Learning Assistant</p>

    <input type="text" id="question" placeholder="what is python?">
    <button onclick="askAI()">Ask</button>

    <div id="output">Answer will appear here...</div>

    <script>
        async function askAI() {
            const text = document.getElementById('question').value;
            const output = document.getElementById('output');
            output.innerText = "Loading... Please wait 30 sec (Render free server slow)...";

            try {
                const res = await fetch('/qa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text })
                });
                const data = await res.json();
                console.log(data);
                output.innerText = data.result || data.detail || JSON.stringify(data);
            } catch (err) {
                output.innerText = "Error: " + err.message + "\nCheck if GEMINI_API_KEY is set in Render Environment tab!";
            }
        }
    </script>
</body>
</html>
